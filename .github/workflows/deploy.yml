name: Deploy to Shopify
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Shopify
        uses: Shopify/theme-actions/deploy@v1
        with:
          shop: ${{ secrets.SHOP_NAME }}
          api_key: ${{ secrets.SHOPIFY_API_KEY }}
          api_secret: ${{ secrets.SHOPIFY_API_SECRET }}
          theme_id: ${{ secrets.SHOPIFY_THEME_ID }}
